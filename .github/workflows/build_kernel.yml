name: Build Not SM8250 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device: [z3q]

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev libncursesw5-dev \
            python3 git zip curl jq zstd ccache \
            gcc-aarch64-linux-gnu \
            llvm lld 

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Karachi"


      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
        
      - name: Run build_sm8250.sh
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh "${{ matrix.device }}" "clang-toolchain"

      - name: Record End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Find ZIP File
        run: |
          zip=$(ls not-*.zip 2>/dev/null | head -n1)
          if [ -z "$zip" ]; then
            echo "❌ No ZIP found!"
            exit 1
          fi
          echo "zip_file=$zip" >> $GITHUB_ENV
          echo "DEVICE_NAME=${{ matrix.device }}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE_NAME }}
          path: ${{ env.zip_file }}
